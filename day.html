<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>📰 信息日报</title>
<link rel="stylesheet" href="./"> <!-- reuse main page styles -->
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"Microsoft YaHei","PingFang SC",sans-serif;background:#0a0a1a;color:#333;overflow-x:hidden}
.container{max-width:794px;margin:0 auto;position:relative;z-index:2}

/* ── Starry BG ── */
.stars{position:fixed;inset:0;z-index:0;pointer-events:none;animation:twinkle 2.5s infinite alternate}
.stars2{position:fixed;inset:0;z-index:0;pointer-events:none;animation:twinkle2 3.5s infinite alternate}
@keyframes twinkle{0%,100%{opacity:.3}50%{opacity:1}}
@keyframes twinkle2{0%,100%{opacity:.4}33%{opacity:1}66%{opacity:.6}}

/* ── Header ── */
.header{background:linear-gradient(135deg,#1a1a2e,#16213e 40%,#0f3460);color:#fff;padding:32px 40px 24px;margin-bottom:16px;position:relative;overflow:hidden}
.header::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 15% 85%,rgba(26,115,232,.18),transparent 55%),radial-gradient(ellipse at 85% 15%,rgba(232,113,10,.15),transparent 55%),radial-gradient(ellipse at 55% 50%,rgba(24,128,56,.10),transparent 60%)}
.header>*{position:relative;z-index:1}
.header-date{font-size:13px;color:rgba(255,255,255,.55);letter-spacing:3px;margin-bottom:8px}
.header-title{font-size:28px;font-weight:800;background:linear-gradient(90deg,#60a5fa,#f59e0b,#4ade80);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:6px}
.header-line{width:70px;height:3px;background:linear-gradient(90deg,#1a73e8,#e8710a,#188038);border-radius:2px;animation:shimmer 2s infinite}
@keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
.header-line{background-size:200% 100%}
.header-quote{font-size:14px;color:rgba(255,255,255,.7);line-height:1.8;font-style:italic;border-left:3px solid rgba(245,158,11,.45);padding-left:14px;margin-top:14px}

/* ── Section ── */
.section{margin-bottom:10px}
.section-head{display:flex;align-items:baseline;gap:8px;padding:12px 32px;font-size:16px;font-weight:700;margin-bottom:6px}
.section-head.ai{border-left:4px solid #1a73e8;background:linear-gradient(90deg,#f0f5ff,#f0f5ff 60%,transparent)}
.section-head.anime{border-right:4px solid #e8710a;background:linear-gradient(270deg,#fff8f0,#fff8f0 60%,transparent)}
.section-head.game{border-left:4px solid #188038;background:linear-gradient(90deg,#f0faf0,#f0faf0 60%,transparent)}
.section-count{font-size:12px;color:#999}
.section-summary{font-size:13px;color:#aaa;font-style:italic;flex:1}
.section-body{display:flex;padding:0 32px}
.section-body.game-body{flex-direction:row-reverse}

/* ── Cards ── */
.cards{flex:0 0 70%;display:flex;flex-direction:column;gap:8px}
.card{background:linear-gradient(90deg,var(--bg),#fafafa);border-radius:6px;padding:12px 14px;border:1px solid #e8e8e8;position:relative;animation:fadeIn .4s ease backwards}
.card:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(0,0,0,.08);transition:.2s}
.card .num{position:absolute;top:12px;left:12px;width:24px;height:24px;border-radius:50%;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;color:#fff}
.card.ai{--bg:#e8f0fe;border-left:3px solid #1a73e8}
.card.anime{--bg:#fef3e6;border-left:3px solid #e8710a}
.card.game{--bg:#e6f4ea;border-left:3px solid #188038}
.card.ai .num{background:#1a73e8}
.card.anime .num{background:#e8710a}
.card.game .num{background:#188038}
.card-title{font-size:14px;font-weight:700;margin:0 0 0 36px;line-height:1.4;border-bottom:1px dashed #e8e8e8;padding-bottom:6px}
.card-summary{font-size:13px;color:#555;margin:4px 0 0 36px;line-height:1.5}
.card-source{font-size:12px;color:#888;margin:4px 0 0 36px}
.card-source a{color:var(--c);text-decoration:none}

/* ── Sidebar ── */
.sidebar{flex:0 0 28%;margin:0 16px 16px 0;background:var(--sb);border:1px solid var(--sbb);border-radius:10px;position:relative;min-height:200px;overflow:hidden}
.section-body.game-body .sidebar{margin:0 0 16px 16px}
.sidebar img{position:absolute;width:70%;border-radius:8px;box-shadow:0 4px 14px rgba(0,0,0,.12);object-fit:cover}
.sidebar img:nth-child(1){top:3%;left:8%;transform:rotate(-2deg)}
.sidebar img:nth-child(2){top:32%;left:18%;transform:rotate(3deg)}
.sidebar img:nth-child(3){top:61%;left:5%;transform:rotate(-1deg)}
.sidebar.ai{--sb:#f0f5ff;--sbb:#d2e3fc}
.sidebar.anime{--sb:#fff8f0;--sbb:#fce8d5}
.sidebar.game{--sb:#f0faf0;--sbb:#ceead6}

/* ── Footer ── */
.footer{text-align:center;padding:12px;color:#aaa;font-size:12px;letter-spacing:1px}
.footer a{color:#aaa;text-decoration:none}

@keyframes fadeIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}

/* ── Mobile ── */
@media(max-width:768px){
  .container{max-width:100%;padding:0 4px}
  .header{padding:16px 14px 12px}
  .header-title{font-size:20px}
  .section-head{padding:10px 10px 6px;gap:4px;font-size:14px}
  .section-body{flex-direction:column!important}
  .cards{flex:1;padding:0}
  .sidebar{display:none}
}
</style>
</head>
<body>
<div class="stars"></div>
<div class="stars2"></div>
<div class="container" id="app">
  <div style="text-align:center;color:#888;padding:80px 0">加载中…</div>
</div>

<script>
const params = new URLSearchParams(location.search);
const date = params.get('date');
document.title = `📰 信息日报 | ${date || ''}`;

(async() => {
  const el = document.getElementById('app');
  if (!date) { el.innerHTML = '<div style="text-align:center;color:#888;padding:60px">缺少日期参数</div>'; return; }

  try {
    const res = await fetch(`./history/${date}.json`);
    if (!res.ok) throw new Error('404');
    const d = await res.json();

    const w = ['日','一','二','三','四','五','六'];
    const dt = new Date(d.date + 'T12:00:00+08:00');
    const dateStr = `${dt.getFullYear()}年${dt.getMonth()+1}月${dt.getDate()}日 周${w[dt.getDay()]}`;

    const theme = {ai:['#1a73e8','🤖','AI 前沿','#f0f5ff','#d2e3fc'],
                   anime:['#e8710a','🎬','动漫','#fff8f0','#fce8d5'],
                   game:['#188038','🎮','游戏','#f0faf0','#ceead6']};

    let secs = '';
    d.sections.forEach((s,i) => {
      const t = theme[s.key];
      const sideImgs = [1,2,3].map(n => `<img src="./assets/sidebar-${s.key}-${n}.png" alt="">`).join('');
      const cs = s.items.map((it,idx) => `
        <div class="card ${s.key}" style="animation-delay:${idx*.06}s">
          <span class="num">${idx+1}</span>
          <div class="card-title">${it.title}</div>
          ${it.summary?`<div class="card-summary">${it.summary}</div>`:''}
          <div class="card-source">${it.url?`<a href="${it.url}" target="_blank">${it.source}</a>`:it.source}</div>
        </div>`).join('');

      secs += `
        <div class="section">
          <div class="section-head ${s.key}" style="${i%2?`border-left:none;border-right:4px solid ${t[0]};background:linear-gradient(270deg,${t[3]},${t[3]} 60%,transparent)`:`border-left:4px solid ${t[0]};background:linear-gradient(90deg,${t[3]},${t[3]} 60%,transparent)`}">
            <span>${t[1]}</span>·<span>${t[2]}</span>
            <span class="section-count">${s.items.length}条</span>
            <span class="section-summary">${s.summary}</span>
          </div>
          <div class="section-body${s.key==='game'?' game-body':''}">
            <div class="cards">${cs}</div>
            <div class="sidebar ${s.key}">${sideImgs}</div>
          </div>
        </div>`;
    });

    el.innerHTML = `
      <div class="header"><div class="header-date">${dateStr}</div>
        <div class="header-title">📰 信息日报</div>
        <div class="header-line"></div>
        <div class="header-quote">${d.quote||''}</div>
      </div>
      ${secs}
      <div class="footer">— 信息日报 · ${dateStr} · <a href="./history.html">📂 历史归档</a> —</div>
    `;
  } catch(e) {
    el.innerHTML = `<div style="text-align:center;color:#888;padding:60px">日报数据不存在 (${date})<br><a href="./history.html" style="color:#60a5fa">← 返回归档</a></div>`;
  }
})();
</script>
</body>
</html>
